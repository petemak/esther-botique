<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 264" fill="none" color="#4A1D42" role="img" aria-label="House of Esther">
  <!-- Finalized primary lockup. Single colour: set via CSS `color`
       (default Aubergine #4A1D42). For the reversed mark set color:#F7F1F7 on Aubergine. -->
  <title>House of Esther</title>
  <!-- Monogram: boutique arch ("house") framing a serif E ("Esther") -->
  <g transform="translate(97 8) scale(0.9)">
    <path d="M10 150 V70 A60 60 0 0 1 130 70 V150 Z" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="round"/>
    <path fill="currentColor" d="M38 42 H96 V55 H60 V73 H84 V85 H60 V105 H98 V118 H38 V108 Q38 100 46 100 V60 Q38 60 38 52 Z M94 39 H99 V58 H94 Z M82 70 H87 V88 H82 Z M96 102 H101 V121 H96 Z"/>
  </g>
  <!-- Wordmark: ESTHER dominant, HOUSE OF spaced small above. Fraunces with serif fallbacks. -->
  <text x="160" y="205" text-anchor="middle" fill="currentColor" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" letter-spacing="7.5">HOUSE OF</text>
  <text x="160" y="250" text-anchor="middle" fill="currentColor" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" letter-spacing="3">ESTHER</text>
</svg>
