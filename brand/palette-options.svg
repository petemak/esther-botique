  <text x="30" y="470" font-size="11" fill="#241E24">Warmest → softest: <tspan font-weight="700">B</tspan>   ·   warm but restrained: <tspan font-weight="700">A</tspan>   ·   coolest / most modern: <tspan font-weight="700">C</tspan>. All keep Fraunces + Inter and the arch-and-E mark.</text>
